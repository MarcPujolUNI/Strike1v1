{% extends 'base/base.html' %}
{% block title %} Strike 1v1 - Reviews {% endblock %}

{% block content %}
<div class="w-full max-w-[600px] shadow-[10px_10px_0px_rgba(0,0,0,0.5)] font-tahoma">
    <div class="xp-title-bar h-[35px] flex justify-between items-center px-3 border-b-2 border-black">
        <div class="flex items-center text-[13px] font-bold text-white drop-shadow-[1px_1px_2px_rgba(0,0,0,0.8)]">
            <div class="bg-brand-red w-5 h-5 flex justify-center items-center rounded-[3px] mr-2.5 text-[12px] border border-black/40 shadow-[1px_1px_0px_rgba(0,0,0,0.5)]">
                S
            </div>
            Reviews - Search Players
        </div>
        <div class="flex gap-1">
            <span class="ctrl-display">_</span>
            <span class="ctrl-display">□</span>
            <span class="ctrl-display close">x</span>
        </div>
    </div>

    <div class="bg-card-dark border-x border-b border-black p-8 md:p-12">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-black/40 border-2 border-brand-red rounded-full mb-4 shadow-[0_0_15px_rgba(255,77,77,0.2)]">
                <span class="material-symbols-outlined text-brand-red text-4xl">person_search</span>
            </div>
            <h2 class="text-white font-black text-2xl uppercase tracking-tighter italic">Search for players reviews</h2>
            <div class="flex items-center justify-center gap-2 mt-1">
                <div class="h-[1px] w-8 bg-brand-red/50"></div>
                <p class="text-footer-text text-[10px] font-black uppercase tracking-[2px]">Locate reviews about other players</p>
                <div class="h-[1px] w-8 bg-brand-red/50"></div>
            </div>
        </div>

        <div class="relative group">
            <div class="absolute -inset-1 bg-brand-red/20 rounded blur opacity-25 group-focus-within:opacity-100 transition duration-1000"></div>
            <div class="relative">
                <input type="text" id="user-search"
                       placeholder="INPUT USERNAME..."
                       autocomplete="off"
                       class="w-full bg-black border-2 border-white/10 p-5 text-white text-center font-black text-sm outline-none focus:border-brand-red transition-all placeholder:text-white/10 shadow-[inset_2px_2px_10px_rgba(0,0,0,0.5)] uppercase tracking-widest">
            </div>

            <div id="search-results" class="hidden absolute w-full mt-3 bg-black border-2 border-brand-red shadow-[8px_8px_0px_rgba(0,0,0,0.6)] z-50 overflow-hidden divide-y divide-white/5">
            </div>
        </div>
    </div>
</div>

<script>
const input = document.getElementById('user-search');
const resultsDiv = document.getElementById('search-results');
let debounceTimer;

input.addEventListener('input', function() {
    const q = this.value;
    clearTimeout(debounceTimer);

    if (q.length < 1) {
        resultsDiv.classList.add('hidden');
        return;
    }

    debounceTimer = setTimeout(() => {
        fetch(`/reviews/search/?q=${q}`)
            .then(response => response.json())
            .then(data => {
                resultsDiv.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    resultsDiv.classList.remove('hidden');
                    data.results.forEach(user => {
                        const a = document.createElement('a');
                        a.href = user.url;
                        // Hover simple: fondo rojo
                        a.className = 'flex items-center p-4 text-white hover:bg-brand-red group transition-colors cursor-pointer';
                        a.innerHTML = `
                            <span class="text-brand-red mr-3 font-black group-hover:text-white transition-colors">>></span>
                            <span class="text-xs font-black uppercase tracking-wider">${user.username}</span>
                        `;
                        resultsDiv.appendChild(a);
                    });
                } else {
                    resultsDiv.innerHTML = '<div class="p-4 text-[10px] font-black text-footer-text uppercase text-center italic">No records found for this query</div>';
                    resultsDiv.classList.remove('hidden');
                }
            });
    }, 300);
});

document.addEventListener('click', function(e) {
    if (!input.contains(e.target) && !resultsDiv.contains(e.target)) {
        resultsDiv.classList.add('hidden');
    }
});
</script>
{% endblock %}
